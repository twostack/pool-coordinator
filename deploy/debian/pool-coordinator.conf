[program:pool-coordinator]
command=/opt/pool-coordinator/run.sh
directory=/var/lib/pool-coordinator
user=pool-coordinator
environment=HOME="/var/lib/pool-coordinator"

; Stopped until the operator has created the pool and starts it.
autostart=false
; Restart after a crash, not after a refusal to start (exit 70/78), which
; needs the operator.
autorestart=unexpected
exitcodes=0
startsecs=10
startretries=3

; SIGTERM lets the coordinator finish storing what it has before it exits.
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/pool-coordinator/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/pool-coordinator/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
