# pool-coordinator configuration. Copy this file, fill in the endpoints and
# paths, and run `pool_coordinator create` to issue a pool: it generates the
# owner key and the ricochet identity, writes the wallet and identity files,
# and fills in `genesis` below.
#
# Nothing secret goes in this file. The wallet passphrase is read from
# POOL_WALLET_PASSPHRASE or the file named at wallet.passphrase_file; a node's
# RPC password from POOL_RPC_PASSWORD or chain.rpc_password_file.

# The aggregation plan the pool runs: `test` (4 transfers, fits ARC) or
# `production` (256 transfers; publishes through a node only).
plan: test

# Which address format the pool uses: `test` for regtest and testnet, `main`.
network: test

chain:
  # `node` publishes and reads through a node's RPC (localnet); `testnet`
  # broadcasts through ARC and reads through WhatsOnChain.
  kind: node
  rpc_url: http://localhost:18332
  rpc_user: bitcoin
  # rpc_password_file: /etc/pool/rpc.password
  # For kind testnet:
  # arc_url: https://arc-test.taal.com/v1
  # woc_url: https://api.whatsonchain.com/v1/bsv/test
  # ARC refuses to parse a scriptSig over this many bytes (measured on
  # localnet); a transaction over it is refused before it is sent.
  arc_scriptsig_limit: 1636802
  timeout_seconds: 30
  retries: 3

ricochet:
  # The ricochet server's multiaddr, with its peer id.
  server: /ip4/127.0.0.1/udp/55223/udx/p2p/REPLACE_WITH_SERVER_PEER_ID
  # The coordinator's Ed25519 identity seed, written by `create`.
  identity_file: identity.seed
  send_retries: 3

wallet:
  # The owner key and the coins, encrypted under the passphrase.
  file: wallet.enc
  # passphrase_file: /etc/pool/wallet.passphrase
  # Log a warning when the wallet can pay for fewer rounds than this.
  warn_rounds_left: 5
  # The store of ready coins each funding request is served from, so no
  # request waits for a block. Coins are split from larger ones ahead of
  # time, with amounts that follow Benford's law.
  coins:
    # the smallest coin a request is served from, in satoshis
    floor: 10000
    # the ready coins the wallet keeps: about ten rounds' worth
    target: 30
    # below this many, ready or on their way, it splits more
    low_water: 12
    # the most outputs one split makes; at most 100
    split_max_outputs: 100

store:
  directory: store
  keep_snapshots: 10

# Written by `create`; the txids of the pool's issuance, witness 0 and Y_0.
# genesis:
#   issuance: <txid>
#   witness0: <txid>
#   slot0: <txid>

round:
  # Satoshis per kB each transaction pays, and the least any pays.
  fee_rate: 1
  fee_floor: 135
  # How long a pending round waits after its first transfer before closing short.
  deadline_seconds: 600
  # Padding transfers kept proved ahead.
  padding_stock: 3
  # Blocks a deposit's refund must sit beyond the chain height.
  deposit_margin: 100

server:
  # How often the submissions folder is drained, in milliseconds.
  poll_ms: 2000
  status_file: status.json
  # How often the chain is asked whether a transaction is mined.
  mined_poll_ms: 2000
  # How long a funding request waits for a ready coin before the round fails.
  funding_timeout_seconds: 3600
  # Rounds published and not yet mined at which the next round waits for
  # one to be mined, so the pool's unconfirmed chain stays inside the
  # ancestor limits of ARC and the node.
  max_unmined_rounds: 10
  # Blocks after which a round still unmined is broadcast again, its
  # funding first.
  rebroadcast_after_blocks: 3

# The read-only API a public landing page reads: the pool's rounds, its
# statistics and the live state of the round being built. Off unless
# enabled; it binds to loopback only and is reached through a proxy on this
# host (see deploy/). It serves nothing about a single submission.
# api:
#   enabled: true
#   bind: 127.0.0.1
#   port: 8787
#   # The pool's history of rounds, rebuilt from the store if deleted.
#   metrics_file: metrics.sqlite
#   # Every time served is rounded to this, and the live state changes at
#   # most this often; at least 10.
#   publish_interval_seconds: 30
#   max_subscribers: 200
#   # What wallets are told to join the pool with, shown on the page as a
#   # `cloak init` command and a config file. Leave it out to show nothing.
#   # wallet:
#   #   # the ricochet server as wallets reach it: its public /ip4 or /ip6
#   #   # address (wallets cannot dial a DNS name), with ricochet.server's peer id
#   #   server: /ip4/203.0.113.7/udp/55223/udx/p2p/12D3KooW...
#   #   # chain peers, as host:port, that a wallet's header sync can use; at most 8
#   #   peers:
#   #     - 198.154.93.206:18333
#   #   # an ARC endpoint a wallet on this network can use without a key
#   #   arc_url: https://testnet.arc.gorillapool.io/v1
